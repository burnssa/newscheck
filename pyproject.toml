[project]
name = "newscheck"
version = "0.1.0"
description = "Open source news article claim extraction"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "trafilatura>=1.6",
    "openai>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sse-starlette>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
# sqlalchemy is only needed if you point DATABASE_URL at a language_models table

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
